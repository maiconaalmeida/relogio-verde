<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relógio Verde - prévia</title><style>html,body{margin:0;background:#000;color:#97b5a6;font:14px system-ui;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}aside{position:fixed;bottom:24px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;transition:opacity .6s}button{color:#b9ffd8;border:1px solid #294c3a;border-radius:8px;background:#07130c;padding:10px 16px;cursor:pointer}body.idle aside{opacity:0;pointer-events:none}small{display:block;margin-top:5px;color:#6e8a7c}</style><canvas aria-label="Relógio com arcos verdes e hora local" role="img"></canvas><aside><div>RELÓGIO VERDE<small>24 horas no círculo interno • 60 minutos no externo</small></div><button id="full">Tela cheia</button></aside><script>
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),masks=[63,6,91,79,102,109,125,7,127,111];
const lines=[[5,0,27,0],[30,5,30,26],[30,36,30,57],[5,62,27,62],[2,36,2,57],[2,5,2,26],[5,31,27,31]];
let idle; function activity(){document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),4000)}
window.addEventListener('pointermove',activity);window.addEventListener('keydown',activity);activity();
document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.querySelector('#full').textContent='Use F11 no computador'}};
function glow(x1,y1,x2,y2,w){g.lineCap='round';for(let i=4;i>=1;i--){g.strokeStyle='rgba(45,255,154,.047)';g.lineWidth=w+i*4;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}g.strokeStyle='#6fffb9';g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function progressAt(now){const seconds=now.getSeconds()+now.getMilliseconds()/1000,minutes=now.getMinutes()+seconds/60;return {hours:(now.getHours()+minutes/60)/24,minutes:minutes/60}}
function ring(r,progress){const angle=Math.max(0,Math.min(1,progress))*360;for(let i=0;i<60;i++){const sweep=Math.min(4,angle-i*6);if(sweep<=0)break;for(let k=4;k>=0;k--){g.strokeStyle=k===0?'#6fffb9':'rgba(45,255,154,.047)';g.lineWidth=5+k*4;g.lineCap='round';g.beginPath();g.arc(0,0,r,(-90+i*6)*Math.PI/180,(-90+i*6+sweep)*Math.PI/180);g.stroke()}}}
function draw(){const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#000';g.fillRect(0,0,w,h);const s=Math.min(w/900,h/760),t=performance.now()/1000;g.translate(w/2,h/2);g.scale(s,s);const now=new Date(),progress=progressAt(now);ring(235,progress.minutes);ring(195,progress.hours);glow(0,0,0,.01,8);const text=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');let x=-[...text].reduce((n,c)=>n+(c===':'?18:42),0)/2;for(const c of text){if(c===':'){glow(x+5,58,x+5,60,3);glow(x+5,83,x+5,85,3);x+=18}else{lines.forEach((p,i)=>{if(masks[+c]&(1<<i))glow(x+p[0],40+p[1],x+p[2],40+p[3],3)});x+=42}}}draw();setInterval(draw,100);
</script></html>
